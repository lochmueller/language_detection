deptrac:
  paths:
    - ./Classes
  layers:
    - name: Check
      collectors:
        - type: classNameRegex
          value: '#^Lochmueller\\LanguageDetection\\Check\\[^\\]*Check$#'
    - name: Detect
      collectors:
        - type: classNameRegex
          value: '#^Lochmueller\\LanguageDetection\\Detect\\[^\\]*Detect$#'
    - name: Domain
      collectors:
        - type: directory
          value: Classes/Domain/.*
    - name: Event
      collectors:
        - type: classNameRegex
          value: '#^Lochmueller\\LanguageDetection\\Event\\.*$#'
    - name: Handler
      collectors:
        - type: classNameRegex
          value: '#^Lochmueller\\LanguageDetection\\Handler\\.*#'
    - name: Middleware
      collectors:
        - type: classNameRegex
          value: '#^Lochmueller\\LanguageDetection\\Middleware\\[^\\]*Middleware$#'
    - name: Negotiation
      collectors:
        - type: classNameRegex
          value: '#^Lochmueller\\LanguageDetection\\Negotiation\\[^\\]*Negotiation$#'
    - name: Response
      collectors:
        - type: directory
          value: Classes/Response/.*
    - name: Service
      collectors:
        - type: directory
          value: Classes/Service/.*
    - name: ExternalTypo3Core
      collectors:
        - type: classNameRegex
          value: '#^TYPO3\\CMS\\Core\\.*#'
    - name: ExternalPsr
      collectors:
        - type: classNameRegex
          value: '#^Psr\\.*#i'
    - name: ExternalMaxMind
      collectors:
        - type: classNameRegex
          value: '#^GeoIp2\\.*#'
    - name: ExternalGuzzle
      collectors:
        - type: classNameRegex
          value: '#^GuzzleHttp\\.*#'
    - name: ExternalSymfony
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\Component\\.*#'
  ruleset:
    Check:
      - Service
      - Event
      - ExternalTypo3Core
      - ExternalPsr
    Detect:
      - Domain
      - Service
      - Event
      - ExternalTypo3Core
      - ExternalPsr
      - ExternalMaxMind
    Handler:
      - Service
      - Check
      - Event
      - ExternalTypo3Core
      - ExternalPsr
    Middleware:
      - Handler
      - ExternalPsr
    Negotiation:
      - Service
      - Event
      - ExternalTypo3Core
    Response:
      - Service
      - Event
      - Domain
      - ExternalTypo3Core
      - ExternalPsr
    Service:
      - Domain
      - Handler
      - ExternalTypo3Core
      - ExternalPsr
      - ExternalSymfony
      - ExternalGuzzle
    Event:
      - Domain
      - ExternalTypo3Core
      - ExternalPsr
    ExternalTypo3Core: ~
    ExternalPsr: ~
    ExternalMaxMind: ~
    ExternalSymfony: ~
    ExternalGuzzle: ~
